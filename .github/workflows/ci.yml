name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend / PostgreSQL tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: kozove_ci
          POSTGRES_PASSWORD: ci-only-disposable-password
          POSTGRES_DB: kozove_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U kozove_ci -d kozove_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 15

    env:
      DATABASE_URL: postgresql+psycopg://kozove_ci:ci-only-disposable-password@127.0.0.1:5432/kozove_test
      KOZOVE_TEST_DATABASE_URL: postgresql+psycopg://kozove_ci:ci-only-disposable-password@127.0.0.1:5432/kozove_test
      APP_VERSION: 0.2.0-alpha
      ENVIRONMENT: development
      ADMIN_PASSWORD_HASH: not-used-in-tests
      ABUSE_PEPPER: ci-test-pepper-only-not-for-real-data
      PROXY_SHARED_SECRET: ci-test-proxy-secret-only-not-prod
      TURNSTILE_SECRET: 1x0000000000000000000000000000000AA

    defaults:
      run:
        working-directory: apps/api

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: apps/api/requirements.txt

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Check Python syntax
        run: python -m compileall -q app tests

      - name: Verify Alembic migrations on disposable database
        run: python -m alembic upgrade head

      - name: Run tests (including PostgreSQL integration tests)
        run: python -m pytest -q -ra tests/

  frontend:
    name: Frontend / Nuxt build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: apps/web

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install locked dependencies
        run: npm ci

      - name: Build Nuxt application
        run: npm run build
