name: Dependency security checks

on:
  workflow_dispatch:
  schedule:
    - cron: '17 5 * * 1'

permissions:
  contents: read

jobs:
  python-dependencies:
    name: Python / pip-audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install auditor
        run: python -m pip install pip-audit
      - name: Audit declared Python requirements
        run: pip-audit -r apps/api/requirements.txt

  javascript-dependencies:
    name: JavaScript / npm audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Check vulnerabilities in lockfile
        run: npm audit --omit=dev --audit-level=high
